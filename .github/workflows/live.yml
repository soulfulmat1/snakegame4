
name: YouTube Snake Live - 11h20m

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snakegame5-youtube-live
  cancel-in-progress: false

jobs:
  part1:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      deadline: ${{ steps.clock.outputs.deadline }}

    steps:
      - uses: actions/checkout@v4

      - name: Set 11h20m deadline
        id: clock
        shell: bash
        run: |
          echo "deadline=$(( $(date +%s) + 40800 ))" >> "$GITHUB_OUTPUT"

      - name: Stream first segment
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          DEADLINE: ${{ steps.clock.outputs.deadline }}
          SEGMENT_SECONDS: '19800'
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${YOUTUBE_STREAM_KEY:?Missing stream key}"
          : "${DEADLINE:?Missing deadline}"

          test -f index.html || exit 1

          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg xvfb pulseaudio chromium-browser

          export DISPLAY=:99
          export PULSE_SINK=GameAudio

          Xvfb :99 -screen 0 1080x1920x24 \
            -ac +extension GLX +render -noreset \
            >/tmp/xvfb.log 2>&1 &

          sleep 3

          pulseaudio --start --exit-idle-time=-1 || true

          pactl load-module module-null-sink \
            sink_name=GameAudio \
            sink_properties=device.description=GameAudio || true

          pactl set-default-sink GameAudio
          pactl set-default-source GameAudio.monitor || true

          BROWSER=$(command -v chromium-browser || command -v chromium)

          start_browser() {
            "$BROWSER" \
              --no-sandbox \
              --no-first-run \
              --disable-dev-shm-usage \
              --disable-gpu \
              --autoplay-policy=no-user-gesture-required \
              --kiosk \
              --window-size=1080,1920 \
              --window-position=0,0 \
              "file://${GITHUB_WORKSPACE}/index.html" \
              >/tmp/chrome.log 2>&1 &
            BROWSER_PID=$!
          }

          start_browser
          sleep 8

          SEGMENT_END=$(( $(date +%s) + SEGMENT_SECONDS ))

          if (( DEADLINE < SEGMENT_END )); then
            SEGMENT_END=$DEADLINE
          fi

          while (( $(date +%s) < SEGMENT_END )); do

            if ! kill -0 "$BROWSER_PID" 2>/dev/null; then
              echo "Browser stopped. Restarting."
              start_browser
              sleep 5
            fi

            LEFT=$(( SEGMENT_END - $(date +%s) ))
            (( LEFT > 0 )) || break

            echo "Part 1 remaining: $LEFT seconds"

            ffmpeg -nostdin -hide_banner \
              -loglevel info -stats -stats_period 10 \
              -thread_queue_size 4096 \
              -f x11grab \
              -framerate 30 \
              -video_size 1080x1920 \
              -i :99.0 \
              -thread_queue_size 4096 \
              -f pulse \
              -i GameAudio.monitor \
              -t "$LEFT" \
              -map 0:v:0 \
              -map 1:a:0 \
              -c:v libx264 \
              -preset ultrafast \
              -tune zerolatency \
              -pix_fmt yuv420p \
              -r 30 \
              -g 60 \
              -keyint_min 60 \
              -b:v 4500k \
              -maxrate 5000k \
              -bufsize 9000k \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -ac 2 \
              -f flv \
              "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" || true

            (( $(date +%s) < SEGMENT_END )) || break

            echo "FFmpeg stopped. Restarting in 5 seconds."
            sleep 5
          done

          echo "Part 1 completed."

  part2:
    needs: part1
    if: ${{ needs.part1.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Stream remaining time
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          DEADLINE: ${{ needs.part1.outputs.deadline }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${YOUTUBE_STREAM_KEY:?Missing stream key}"
          : "${DEADLINE:?Missing deadline}"

          test -f index.html || exit 1

          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg xvfb pulseaudio chromium-browser

          export DISPLAY=:99
          export PULSE_SINK=GameAudio

          Xvfb :99 -screen 0 1080x1920x24 \
            -ac +extension GLX +render -noreset \
            >/tmp/xvfb.log 2>&1 &

          sleep 3

          pulseaudio --start --exit-idle-time=-1 || true

          pactl load-module module-null-sink \
            sink_name=GameAudio \
            sink_properties=device.description=GameAudio || true

          pactl set-default-sink GameAudio
          pactl set-default-source GameAudio.monitor || true

          BROWSER=$(command -v chromium-browser || command -v chromium)

          "$BROWSER" \
            --no-sandbox \
            --no-first-run \
            --disable-dev-shm-usage \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --kiosk \
            --window-size=1080,1920 \
            --window-position=0,0 \
            "file://${GITHUB_WORKSPACE}/index.html" \
            >/tmp/chrome.log 2>&1 &

          sleep 8

          while (( $(date +%s) < DEADLINE )); do

            LEFT=$(( DEADLINE - $(date +%s) ))
            (( LEFT > 0 )) || break

            echo "Part 2 remaining: $LEFT seconds"

            ffmpeg -nostdin -hide_banner \
              -loglevel info -stats -stats_period 10 \
              -thread_queue_size 4096 \
              -f x11grab \
              -framerate 30 \
              -video_size 1080x1920 \
              -i :99.0 \
              -thread_queue_size 4096 \
              -f pulse \
              -i GameAudio.monitor \
              -t "$LEFT" \
              -map 0:v:0 \
              -map 1:a:0 \
              -c:v libx264 \
              -preset ultrafast \
              -tune zerolatency \
              -pix_fmt yuv420p \
              -r 30 \
              -g 60 \
              -keyint_min 60 \
              -b:v 4500k \
              -maxrate 5000k \
              -bufsize 9000k \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -ac 2 \
              -f flv \
              "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" || true

            (( $(date +%s) < DEADLINE )) || break

            echo "FFmpeg disconnected. Restarting in 5 seconds."
            sleep 5
          done

          echo "11 hours 20 minutes deadline reached."
