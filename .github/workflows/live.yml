
name: Snake Game 3 - Single Live 11h20m

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snakegame3-youtube-live
  cancel-in-progress: false

jobs:
  livestream:
    runs-on: ubuntu-24.04
    timeout-minutes: 700

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            pulseaudio-utils \
            xdotool \
            unclutter \
            chromium-browser

      - name: Start single continuous livestream
        shell: bash

        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |
          set -Eeuo pipefail

          : "${YOUTUBE_STREAM_KEY:?Missing YouTube stream key}"

          test -f index.html || {
            echo "ERROR: index.html not found"
            exit 1
          }

          # TOTAL DURATION: 11 HOURS 20 MINUTES
          DURATION=40800

          # Deadline starts after installation
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + DURATION))

          export DISPLAY=:99
          export PULSE_SINK=GameAudio
          export PULSE_SERVER=unix:/tmp/pulse-native

          echo "Starting Snake Game Live"
          echo "Duration: 11 hours 20 minutes"

          # Start virtual display
          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 3

          # Start audio server
          pulseaudio --start \
            --exit-idle-time=-1 \
            --disallow-exit \
            || true

          unset PULSE_SERVER

          sleep 2

          # Create virtual audio output
          pactl load-module module-null-sink \
            sink_name=GameAudio \
            sink_properties=device.description=GameAudio \
            rate=48000 \
            channels=2 || true

          pactl set-default-sink GameAudio

          pactl set-default-source \
            GameAudio.monitor || true

          export PULSE_SINK=GameAudio

          # Keep audio output active
          pactl set-sink-mute GameAudio 0
          pactl set-sink-volume GameAudio 100%

          # Find browser
          BROWSER=$(command -v chromium-browser || \
                    command -v chromium || \
                    command -v google-chrome)

          # Start Chromium
          start_browser() {

            "$BROWSER" \
              --no-sandbox \
              --no-first-run \
              --disable-dev-shm-usage \
              --disable-gpu \
              --disable-background-timer-throttling \
              --disable-renderer-backgrounding \
              --disable-backgrounding-occluded-windows \
              --autoplay-policy=no-user-gesture-required \
              --kiosk \
              --start-fullscreen \
              --window-size=1080,1920 \
              --window-position=0,0 \
              --user-data-dir=/tmp/snake-live-profile \
              "file://${GITHUB_WORKSPACE}/index.html" \
              > /tmp/chromium.log 2>&1 &

            BROWSER_PID=$!

            sleep 8

            # Click to activate game and audio
            xdotool mousemove 540 960
            sleep 1
            xdotool click 1
            sleep 2

            # Move cursor away from visible screen
            xdotool mousemove 1079 1919

            # Hide cursor automatically
            unclutter -idle 0.1 -root \
              > /tmp/unclutter.log 2>&1 &

            echo "Browser and audio activation completed"
          }

          start_browser

          # Main streaming loop
          while true; do

            NOW=$(date +%s)
            REMAINING=$((END_TIME - NOW))

            if (( REMAINING <= 0 )); then
              echo "11h20m deadline reached"
              break
            fi

            # Restart browser if it crashes
            if ! kill -0 "$BROWSER_PID" 2>/dev/null; then

              echo "Browser stopped. Restarting..."

              start_browser

            fi

            echo "Time remaining: $REMAINING seconds"

            # Stream video and audio to YouTube
            ffmpeg \
              -nostdin \
              -hide_banner \
              -loglevel warning \
              -stats \
              -thread_queue_size 4096 \
              -f x11grab \
              -framerate 30 \
              -video_size 1080x1920 \
              -i :99.0 \
              -thread_queue_size 4096 \
              -f pulse \
              -sample_rate 48000 \
              -channels 2 \
              -i GameAudio.monitor \
              -t "$REMAINING" \
              -map 0:v:0 \
              -map 1:a:0 \
              -c:v libx264 \
              -preset ultrafast \
              -tune zerolatency \
              -pix_fmt yuv420p \
              -r 30 \
              -g 60 \
              -keyint_min 60 \
              -b:v 4500k \
              -maxrate 5000k \
              -bufsize 9000k \
              -c:a aac \
              -b:a 128k \
              -ar 48000 \
              -ac 2 \
              -af "aresample=async=1:first_pts=0" \
              -flvflags no_duration_filesize \
              -f flv \
              "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
              || true

            NOW=$(date +%s)

            if (( NOW >= END_TIME )); then
              break
            fi

            echo "FFmpeg disconnected."
            echo "Reconnecting in 5 seconds..."

            sleep 5

          done

          echo "Livestream duration completed."

          # Stop browser and streaming processes
          kill "$BROWSER_PID" 2>/dev/null || true

          echo "Single-part livestream finished."
