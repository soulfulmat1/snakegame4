
name: Snake Game Live - 11h20m

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snakegame-live
  cancel-in-progress: false

jobs:
  livestream:
    runs-on: ubuntu-24.04
    timeout-minutes: 700

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install streaming software
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            pulseaudio-utils \
            chromium-browser \
            xdotool \
            unclutter

      - name: Start Snake Game YouTube Live
        shell: bash
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |
          set -Eeuo pipefail

          : "${YOUTUBE_STREAM_KEY:?Missing YouTube stream key}"

          if [[ ! -f index.html ]]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          # 11 hours 20 minutes = 40800 seconds
          DURATION=40800
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + DURATION))

          export DISPLAY=:99
          export PULSE_SINK=GameAudio

          # Remove incorrect PulseAudio configuration
          unset PULSE_SERVER

          echo "Starting Snake Game Live"
          echo "Target duration: 11 hours 20 minutes"

          # Start virtual screen
          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 3

          # Start PulseAudio
          pulseaudio --kill 2>/dev/null || true

          pulseaudio \
            --start \
            --exit-idle-time=-1

          sleep 3

          # Verify PulseAudio
          pactl info

          # Create virtual audio output
          pactl load-module module-null-sink \
            sink_name=GameAudio \
            sink_properties=device.description=GameAudio \
            rate=48000 \
            channels=2

          pactl set-default-sink GameAudio
          pactl set-default-source GameAudio.monitor

          pactl set-sink-mute GameAudio 0
          pactl set-sink-volume GameAudio 100%

          echo "Audio server ready"

          # Find Chromium browser
          BROWSER=$(command -v chromium-browser || \
                    command -v chromium || \
                    command -v google-chrome)

          # Start browser and activate audio
          start_browser() {

            "$BROWSER" \
              --no-sandbox \
              --no-first-run \
              --disable-dev-shm-usage \
              --disable-gpu \
              --disable-background-timer-throttling \
              --disable-renderer-backgrounding \
              --autoplay-policy=no-user-gesture-required \
              --kiosk \
              --window-size=1080,1920 \
              --window-position=0,0 \
              --user-data-dir=/tmp/snake-browser \
              "file://${GITHUB_WORKSPACE}/index.html" \
              > /tmp/chromium.log 2>&1 &

            BROWSER_PID=$!

            sleep 8

            # Activate game with mouse click
            xdotool mousemove 540 960
            sleep 1
            xdotool click 1
            sleep 2

            # Move mouse to edge
            xdotool mousemove 1079 1919

            echo "Game activated"
          }

          start_browser

          # Hide mouse cursor
          unclutter -idle 0.1 -root \
            > /tmp/unclutter.log 2>&1 &

          echo "Mouse cursor hidden"

          # Main streaming loop
          while true; do

            NOW=$(date +%s)
            REMAINING=$((END_TIME - NOW))

            if (( REMAINING <= 0 )); then
              break
            fi

            # Restart browser if necessary
            if ! kill -0 "$BROWSER_PID" 2>/dev/null; then

              echo "Browser crashed. Restarting..."

              start_browser

            fi

            echo "Remaining: $REMAINING seconds"

            # Send video and audio to YouTube
            ffmpeg \
              -nostdin \
              -hide_banner \
              -loglevel warning \
              -stats \
              -thread_queue_size 4096 \
              -f x11grab \
              -framerate 30 \
              -video_size 1080x1920 \
              -i :99.0 \
              -thread_queue_size 4096 \
              -f pulse \
              -sample_rate 48000 \
              -channels 2 \
              -i GameAudio.monitor \
              -t "$REMAINING" \
              -map 0:v:0 \
              -map 1:a:0 \
              -c:v libx264 \
              -preset ultrafast \
              -tune zerolatency \
              -pix_fmt yuv420p \
              -r 30 \
              -g 60 \
              -keyint_min 60 \
              -b:v 4500k \
              -maxrate 5000k \
              -bufsize 9000k \
              -c:a aac \
              -b:a 128k \
              -ar 48000 \
              -ac 2 \
              -af "aresample=async=1:first_pts=0" \
              -f flv \
              "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
              || true

            NOW=$(date +%s)

            if (( NOW >= END_TIME )); then
              break
            fi

            echo "Connection lost. Reconnecting in 5 seconds."

            sleep 5

          done

          echo "11 hours 20 minutes completed"

          kill "$BROWSER_PID" 2>/dev/null || true

          echo "Livestream finished"
