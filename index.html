<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake Shorts — Auto Live Loop</title>
<style>
:root{
  /* --- live theme variables (updated from JS) --- */
  --accent:#caff32;
  --bgTop:#1d6b12;
  --bgBot:#0e4a0d;
  --bgA:#3a9c25;
  --bgB:#12500c;
  --arenaTop:#1a6b22;
  --arenaBot:#0a3410;
  --edge1:rgba(126,226,58,0.33);
  --edge2:rgba(126,226,58,0.13);
  --scoreShadow:#145a0e;
  --pageBg:#041a06;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--pageBg);
  font-family:"Segoe UI",Arial,Helvetica,sans-serif;
  color:#fff;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
body{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ================= COPY BUTTON ================= */
#copyBtn{
  position:fixed;top:8px;right:8px;z-index:99999;
  background:#caff32;color:#124b0d;border:0;border-radius:11px;
  font-weight:900;font-size:12px;letter-spacing:.3px;
  padding:9px 13px;cursor:pointer;
  box-shadow:0 5px 16px #0007, inset 0 1px 0 #ffffff88;
  transition:transform .12s ease, background .2s ease;
  font-family:inherit;
  opacity:.35;
}
#copyBtn:hover{opacity:1}
#copyBtn:active{transform:scale(.94)}
#copyBtn.ok{background:#5ce65c;color:#04350a;opacity:1}
#copyBtn.err{background:#ff5f56;color:#3a0000;opacity:1}

/* ================= FULL 9:16 SHORTS FRAME ================= */
#game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:calc(100vh * 9 / 16);
  max-height:calc(100vw * 16 / 9);
  aspect-ratio:9/16;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%, var(--bgTop) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 100%, var(--bgBot) 0%, transparent 55%),
    linear-gradient(160deg, var(--bgA), var(--bgB));
  isolation:isolate;
}
#game::before{
  content:"";position:absolute;inset:0;z-index:0;opacity:.20;pointer-events:none;
  background-image:
    radial-gradient(circle at 12% 18%,#b6ff6b 0 2px,transparent 3px),
    radial-gradient(circle at 68% 34%,#b6ff6b 0 2px,transparent 3px),
    radial-gradient(circle at 34% 72%,#b6ff6b 0 2px,transparent 3px),
    radial-gradient(circle at 82% 86%,#b6ff6b 0 2px,transparent 3px);
  background-size:77px 83px,91px 73px,105px 97px,63px 71px;
}

/* ================= TOP HUD ================= */
#topHud{
  position:relative;z-index:3;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px 4px;
  gap:8px;
}
#liveBadge{
  display:flex;
  align-items:center;
  gap:6px;
  background:#c81e1e;
  color:#fff;
  font-weight:900;
  font-size:11px;
  letter-spacing:1.5px;
  padding:5px 11px;
  border-radius:20px;
  box-shadow:0 3px 12px #0006, inset 0 1px 0 #ffffff44;
}
#liveBadge .dot{
  width:7px;height:7px;border-radius:50%;
  background:#fff;
  animation:pulseDot 1.1s ease-in-out infinite;
}
@keyframes pulseDot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.7)}
}
#lvlPill{
  display:flex;
  align-items:center;
  gap:5px;
  background:linear-gradient(180deg,#0b4a17,#073b12);
  border:1px solid #ffffff1c;
  border-radius:20px;
  padding:5px 12px;
  font-weight:900;
  font-size:13px;
  color:var(--accent);
  box-shadow:0 3px 10px #052c0b66, inset 0 1px 0 #ffffff26;
  letter-spacing:.5px;
  transition:color .25s ease;
}
#lvlPill small{
  font-size:8px;opacity:.7;color:#fff;letter-spacing:1px;font-weight:800;
}

/* ================= ARENA ================= */
#arenaWrap{
  position:relative;z-index:2;
  flex:1 1 auto;
  min-height:0;
  padding:6px 12px 4px;
}
#arena{
  position:relative;
  width:100%;height:100%;
  border-radius:18px;
  overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%, var(--arenaTop), var(--arenaBot) 75%);
  box-shadow:
    inset 0 0 0 2px #ffffff14,
    inset 0 8px 30px #00000055,
    0 10px 28px #04300a88;
}
#board{display:block;width:100%;height:100%}

/* ================= BIG SCORE BAR ================= */
#bottomBar{
  position:relative;z-index:3;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px 14px 10px;
}
#scoreBox{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  background:linear-gradient(180deg,#0f5a20,#083f14);
  border:1px solid #ffffff22;
  border-radius:22px;
  padding:10px 26px;
  box-shadow:
    0 8px 22px #031d06aa,
    inset 0 1px 0 #ffffff33,
    inset 0 -4px 12px #00000055;
  min-width:180px;
}
#scoreBox .fruit{
  font-size:clamp(28px,8vw,44px);
  line-height:1;
  filter:drop-shadow(0 2px 4px #00000088);
}
#scoreBig{
  font-size:clamp(34px,11vw,62px);
  font-weight:1000;
  letter-spacing:-1.5px;
  color:var(--accent);
  line-height:1;
  text-shadow:0 3px 0 var(--scoreShadow), 0 6px 14px #062e0c99;
  font-variant-numeric:tabular-nums;
  min-width:1.6ch;
  text-align:center;
  transition:color .25s ease;
}

/* ================= BEST PILL ================= */
#bestRow{
  position:relative;z-index:3;
  flex:0 0 auto;
  display:flex;
  justify-content:center;
  padding:0 14px 12px;
}
#bestPill{
  display:flex;
  align-items:center;
  gap:6px;
  background:linear-gradient(180deg,#0b4a17,#073b12);
  border:1px solid #ffffff1c;
  border-radius:16px;
  padding:5px 14px;
  font-weight:800;
  font-size:11px;
  letter-spacing:1.2px;
  color:#fff;
  box-shadow:0 3px 10px #052c0b66, inset 0 1px 0 #ffffff26;
}
#bestPill b{color:var(--accent);font-size:14px;margin-left:2px;transition:color .25s ease}

/* ================= OVERLAY ================= */
#overlay{
  position:absolute;inset:0;z-index:20;
  display:none;
  align-items:center;justify-content:center;
  background:#03260abb;
  backdrop-filter:blur(3px);
}
#overlay.show{display:flex}
#overlay .box{
  width:80%;max-width:320px;
  background:linear-gradient(180deg,#0c4a17,#073b12);
  border:2px solid var(--accent);
  border-radius:20px;
  padding:22px 20px;
  text-align:center;
  box-shadow:0 18px 40px #041f07cc, inset 0 1px 0 #ffffff22;
  animation:boxIn .3s ease-out;
  transition:border-color .25s ease;
}
@keyframes boxIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#overlay h2{margin:0 0 8px;color:var(--accent);font-size:22px;letter-spacing:.5px;transition:color .25s ease}
#overlay p{margin:0 0 14px;font-size:12px;line-height:1.5;opacity:.9}
#overlay .stats{
  display:flex;justify-content:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;
}
#overlay .stats div{
  background:#04290b;border-radius:12px;padding:8px 14px;min-width:74px;
  border:1px solid #ffffff14;
}
#overlay .stats span{display:block;font-size:9px;opacity:.65;letter-spacing:1px}
#overlay .stats b{font-size:18px;color:var(--accent);transition:color .25s ease}

/* ================= EDGE GLOW ================= */
#edgeGlow{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  box-shadow:
    inset 0 0 60px var(--edge1),
    inset 0 0 120px var(--edge2);
  animation:edgePulse 4s ease-in-out infinite;
}
@keyframes edgePulse{
  0%,100%{opacity:.55}
  50%{opacity:1}
}

#watermark{
  position:absolute;
  left:0;bottom:2px;width:100%;
  text-align:center;
  font-size:9px;
  letter-spacing:2px;
  font-weight:800;
  color:#ffffff44;
  z-index:5;
  pointer-events:none;
}
</style>
</head>
<body>

<button id="copyBtn" title="Copy entire HTML source">📋 Copy</button>

<main id="game" aria-label="Auto live snake game for Shorts">

  <div id="edgeGlow"></div>

  <div id="topHud">
    <div id="liveBadge"><span class="dot"></span>LIVE</div>
    <div id="lvlPill"><small>LVL</small><span id="level">1</span></div>
  </div>

  <div id="arenaWrap">
    <div id="arena"><canvas id="board"></canvas></div>
  </div>

  <div id="bottomBar">
    <div id="scoreBox">
      <span class="fruit">🍎</span>
      <span id="scoreBig">0</span>
    </div>
  </div>

  <div id="bestRow">
    <div id="bestPill">BEST <b id="best">0</b></div>
  </div>

  <div id="watermark">SNAKE • AUTO LOOP</div>

  <div id="overlay">
    <div class="box">
      <h2 id="overlayTitle">GAME OVER</h2>
      <div class="stats">
        <div><span>SCORE</span><b id="ovScore">0</b></div>
        <div><span>LEVEL</span><b id="ovLevel">1</b></div>
        <div><span>BEST</span><b id="ovBest">0</b></div>
      </div>
      <p id="overlayText">Restarting…</p>
    </div>
  </div>

</main>

<script>
(function () {
"use strict";

/* ============================================================
   0. COPY BUTTON
   ============================================================ */
const ORIGINAL_SOURCE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
const copyBtn = document.getElementById("copyBtn");
copyBtn.addEventListener("click", async function () {
  const text = ORIGINAL_SOURCE;
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
  }
  const prev = copyBtn.textContent;
  copyBtn.textContent = ok ? "✓ Copied" : "✗ Failed";
  copyBtn.classList.toggle("ok", ok);
  copyBtn.classList.toggle("err", !ok);
  clearTimeout(copyBtn._t);
  copyBtn._t = setTimeout(() => {
    copyBtn.textContent = prev;
    copyBtn.classList.remove("ok", "err");
  }, 1400);
});

/* ============================================================
   1. CONSTANTS
   ============================================================ */
const COLS = 18;
const ROWS = 28;
const TOTAL = COLS * ROWS;

const DIRS = {
  up:    { x: 0,  y: -1 },
  down:  { x: 0,  y: 1  },
  left:  { x: -1, y: 0  },
  right: { x: 1,  y: 0  }
};
const DIR_KEYS = ["up", "down", "left", "right"];
const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

const FOOD_TYPES = [
  { id: "apple",   emoji: "🍎", points: 10, grow:  1, weight: 68, color: "#ff453a" },
  { id: "golden",  emoji: "⭐", points: 50, grow:  2, weight:  6, color: "#ffd60a" },
  { id: "diamond", emoji: "💎", points: 25, grow:  1, weight: 10, color: "#64d2ff" },
  { id: "ghost",   emoji: "👻", points: 20, grow:  1, weight:  5, color: "#bf5af2" },
  { id: "grape",   emoji: "🍇", points: 15, grow: -3, weight: 11, color: "#af52de" }
];
const FOOD_TOTAL_WEIGHT = FOOD_TYPES.reduce((s, f) => s + f.weight, 0);

const BASE_STEP_MS = 200;
const MIN_STEP_MS  = 108;
const GHOST_MS     = 5200;
const BOOST_MS     = 3200;
const START_LEN    = 4;
const MAX_LEVEL    = 12;
const LEVEL_SCORE = 120;
const STUCK_STEPS = 95;

/* ============================================================
   1B. COLOR THEMES
   Snake colour  ===>  background colour follows automatically.
   ============================================================ */
const THEME_DEFS = {
  /* ---------- NORMAL : fresh green ---------- */
  normal: {
    accent:      "#caff32",
    bgTop:       "#1d6b12",
    bgBot:       "#0e4a0d",
    bgA:         "#3a9c25",
    bgB:         "#12500c",
    arenaTop:    "#1a6b22",
    arenaBot:    "#0a3410",
    gridBg:      "#0a3410",
    gridAlt:     "#9dff7a",
    edge:        "#7ee23a",
    scoreShadow: "#145a0e",
    snHead:      "#d8ff9a",
    snMid:       "#7ee23a",
    snTail:      "#145a0e",
    snGlow:      "#7ee23a"
  },
  /* ---------- GHOST : icy cyan ---------- */
  ghost: {
    accent:      "#8ef2ff",
    bgTop:       "#0e5f75",
    bgBot:       "#052a36",
    bgA:         "#1f8fa8",
    bgB:         "#073a4a",
    arenaTop:    "#14576b",
    arenaBot:    "#062a36",
    gridBg:      "#062a36",
    gridAlt:     "#8ef2ff",
    edge:        "#7be7ff",
    scoreShadow: "#0a4a5c",
    snHead:      "#d9f7ff",
    snMid:       "#7bdcff",
    snTail:      "#1f5fa0",
    snGlow:      "#7be7ff"
  },
  /* ---------- BOOST : golden ---------- */
  boost: {
    accent:      "#ffe066",
    bgTop:       "#7a6412",
    bgBot:       "#3f3006",
    bgA:         "#b89a1f",
    bgB:         "#4a3a07",
    arenaTop:    "#6b5a14",
    arenaBot:    "#362a06",
    gridBg:      "#362a06",
    gridAlt:     "#ffe066",
    edge:        "#ffd60a",
    scoreShadow: "#5c4a0a",
    snHead:      "#fff5b8",
    snMid:       "#ffd257",
    snTail:      "#b26a00",
    snGlow:      "#ffd60a"
  }
};
const THEME_KEYS = [
  "accent","bgTop","bgBot","bgA","bgB","arenaTop","arenaBot",
  "gridBg","gridAlt","edge","scoreShadow",
  "snHead","snMid","snTail","snGlow"
];

function hexToRgb(hex) {
  let h = hex.replace("#", "");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const v = parseInt(h, 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
function rgbCss(c) {
  return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")";
}
function rgbaCss(c, a) {
  return "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + "," + a + ")";
}
function shade(c, f) { return [c[0]*f, c[1]*f, c[2]*f]; }

const themeRgb = {};
for (const name in THEME_DEFS) {
  themeRgb[name] = {};
  for (let i = 0; i < THEME_KEYS.length; i++) {
    const k = THEME_KEYS[i];
    themeRgb[name][k] = hexToRgb(THEME_DEFS[name][k]);
  }
}
/* currently displayed colours (start = normal) */
const curTheme = {};
for (let i = 0; i < THEME_KEYS.length; i++) {
  const k = THEME_KEYS[i];
  curTheme[k] = themeRgb.normal[k].slice();
}

const themeVarsCache = {};
function applyThemeCSS() {
  const root = document.documentElement.style;
  const c = curTheme;
  const vars = {
    "--accent":      rgbCss(c.accent),
    "--bgTop":       rgbCss(c.bgTop),
    "--bgBot":       rgbCss(c.bgBot),
    "--bgA":         rgbCss(c.bgA),
    "--bgB":         rgbCss(c.bgB),
    "--arenaTop":    rgbCss(c.arenaTop),
    "--arenaBot":    rgbCss(c.arenaBot),
    "--edge1":       rgbaCss(c.edge, 0.33),
    "--edge2":       rgbaCss(c.edge, 0.13),
    "--scoreShadow": rgbCss(c.scoreShadow),
    "--pageBg":      rgbaCss(shade(c.bgBot, 0.30), 1)
  };
  for (const k in vars) {
    if (themeVarsCache[k] !== vars[k]) {
      root.setProperty(k, vars[k]);
      themeVarsCache[k] = vars[k];
    }
  }
}

let themeSettled = false;
function updateTheme(dt) {
  const name = (game.ghostTime > 0) ? "ghost"
             : (game.boostTime > 0) ? "boost"
             : "normal";
  const tgt = themeRgb[name];
  const k = 1 - Math.exp(-dt * 5.5);   /* ~0.5s smooth cross-fade */
  let moved = false;

  for (let i = 0; i < THEME_KEYS.length; i++) {
    const key = THEME_KEYS[i];
    const a = curTheme[key];
    const b = tgt[key];
    for (let j = 0; j < 3; j++) {
      const d = b[j] - a[j];
      if (Math.abs(d) > 0.6) { a[j] += d * k; moved = true; }
      else if (a[j] !== b[j]) { a[j] = b[j]; moved = true; }
    }
  }
  if (moved || !themeSettled) {
    themeSettled = true;
    applyThemeCSS();
  }
}

/* ============================================================
   2. DOM
   ============================================================ */
const canvas   = document.getElementById("board");
const ctx      = canvas.getContext("2d");
const scoreEl  = document.getElementById("scoreBig");
const levelEl  = document.getElementById("level");
const bestEl   = document.getElementById("best");
const overlayEl= document.getElementById("overlay");
const ovScore  = document.getElementById("ovScore");
const ovLevel  = document.getElementById("ovLevel");
const ovBest   = document.getElementById("ovBest");

/* ============================================================
   3. VIEW
   ============================================================ */
const view = { W:0, H:0, dpr:1, cell:1, gw:0, gh:0, ox:0, oy:0 };

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth  || 300;
  const h = canvas.clientHeight || 300;
  canvas.width  = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
  view.W = w; view.H = h; view.dpr = dpr;
  view.cell = Math.min(w / COLS, h / ROWS);
  view.gw = view.cell * COLS;
  view.gh = view.cell * ROWS;
  view.ox = (w - view.gw) / 2;
  view.oy = (h - view.gh) / 2;
}
function cellCenterF(fx, fy) {
  return { x: view.ox + (fx + 0.5) * view.cell, y: view.oy + (fy + 0.5) * view.cell };
}
function idx(x, y) { return y * COLS + x; }

/* ============================================================
   4. GAME STATE
   ============================================================ */
const game = {
  snake: [],
  prevSnake: [],
  dir: "right",
  food: null,
  obstacles: new Set(),
  pendingGrow: 0,
  score: 0,
  level: 1,
  stepMs: BASE_STEP_MS,
  /* progress of the CURRENT step, 0..1 — keeps motion perfectly
     smooth even when the speed changes mid-step */
  prog: 0,
  dead: false,
  dying: 0,
  ghostTime: 0,
  boostTime: 0,
  best: 0,
  autoRestartTimer: null,
  levelScore: 0,
  recentHeads: [],
  stepsWithoutFood: 0,
  levelTransitions: 0
};

let particles = [];
let floats = [];
const shake = { t:0, dur:1, mag:0 };
let deathFlash = 0;

function effectiveStepMs() {
  let ms = game.stepMs;
  if (game.boostTime > 0) ms /= 1.55;
  return Math.max(55, ms);
}

/* ============================================================
   5. AUDIO — PIANO + GUITAR + BASS + DRUMS
   ============================================================ */
let actx=null, sfxGain=null, musicGain=null;
let musicStarted=false, musicTimer=null;

function initAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      sfxGain = actx.createGain(); sfxGain.gain.value = 0.85;
      sfxGain.connect(actx.destination);
      musicGain = actx.createGain(); musicGain.gain.value = 0.42;
      musicGain.connect(actx.destination);
    } catch(e){ actx=null; }
  }
  if (actx && actx.state === "suspended") actx.resume();
  if (actx && !musicStarted) startBgMusic();
}

function tone(f, d, type, vol, delay) {
  if (!actx || !sfxGain) return;
  const t0 = actx.currentTime + (delay||0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol==null?0.1:vol, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
  o.connect(g); g.connect(sfxGain);
  o.start(t0); o.stop(t0+d+0.03);
}
function sfx(name) {
  if (!actx) return;
  switch (name) {
    case "eat":    tone(680,0.08,"square",0.07); tone(1020,0.09,"square",0.05,0.045); break;
    case "golden": tone(880,0.09,"triangle",0.09);
                   tone(1320,0.09,"triangle",0.08,0.07);
                   tone(1760,0.14,"triangle",0.07,0.15); break;
    case "level":  [523,659,784,1047].forEach((f,i)=>tone(f,0.16,"sine",0.09,i*0.075)); break;
    case "die":    tone(240,0.45,"sawtooth",0.1); tone(160,0.55,"sawtooth",0.08,0.09); break;
    case "click":  tone(480,0.05,"square",0.05); break;
  }
}

/* ---------- Melodious piano + light guitar loop ---------- */
function startBgMusic() {
  if (!actx || musicStarted) return;
  musicStarted = true;

  const BPM = 82;
  const BEAT = 60 / BPM;
  const BAR  = BEAT * 4;
  const LOOKAHEAD = 0.22;

  function kick(t, vol) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.3);
  }
  function snare(t, vol) {
    const len = Math.floor(actx.sampleRate * 0.13);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
    const s = actx.createBufferSource(); s.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1800;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    s.connect(bp); bp.connect(g); g.connect(musicGain);
    s.start(t); s.stop(t + 0.15);
  }
  function hat(t, vol) {
    const len = Math.floor(actx.sampleRate * 0.04);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
    const s = actx.createBufferSource(); s.buffer = buf;
    const hp = actx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6500;
    const g = actx.createGain(); g.gain.value = vol;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t); s.stop(t + 0.05);
  }

  function pianoNote(t, freq, dur, vol) {
    if (freq <= 0) return;
    const o1 = actx.createOscillator();
    const o2 = actx.createOscillator();
    const o3 = actx.createOscillator();
    const g1 = actx.createGain();
    const g2 = actx.createGain();
    const g3 = actx.createGain();
    const master = actx.createGain();

    o1.type = "sine";      o1.frequency.value = freq;
    o2.type = "sine";      o2.frequency.value = freq * 2;
    o3.type = "sine";      o3.frequency.value = freq * 3.005;

    g1.gain.value = 1.00;
    g2.gain.value = 0.32;
    g3.gain.value = 0.10;

    master.gain.setValueAtTime(0.0001, t);
    master.gain.linearRampToValueAtTime(vol, t + 0.006);
    master.gain.exponentialRampToValueAtTime(vol * 0.45, t + 0.20);
    master.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o1.connect(g1); g1.connect(master);
    o2.connect(g2); g2.connect(master);
    o3.connect(g3); g3.connect(master);
    master.connect(musicGain);

    o1.start(t); o1.stop(t + dur + 0.02);
    o2.start(t); o2.stop(t + dur + 0.02);
    o3.start(t); o3.stop(t + dur + 0.02);
  }

  function guitarNote(t, freq, dur, vol) {
    if (freq <= 0) return;
    const o1 = actx.createOscillator();
    const o2 = actx.createOscillator();
    const lp = actx.createBiquadFilter();
    const g = actx.createGain();

    o1.type = "triangle";
    o1.frequency.value = freq;
    o2.type = "sawtooth";
    o2.frequency.value = freq * 1.0035;

    lp.type = "lowpass";
    lp.frequency.setValueAtTime(4200, t);
    lp.frequency.exponentialRampToValueAtTime(900, t + dur);
    lp.Q.value = 1.1;

    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(vol * 0.32, t + 0.10);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o1.connect(lp);
    o2.connect(lp);
    lp.connect(g); g.connect(musicGain);

    o1.start(t); o1.stop(t + dur + 0.02);
    o2.start(t); o2.stop(t + dur + 0.02);
  }

  function bassNote(t, freq, dur, vol) {
    if (freq <= 0) return;
    const o = actx.createOscillator();
    const lp = actx.createBiquadFilter();
    const g = actx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    lp.type = "lowpass";
    lp.frequency.value = 420;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.02);
  }

  const CHORDS = [
    { bass: 110.00, notes: [220.00, 261.63, 329.63, 440.00] },
    { bass:  87.31, notes: [174.61, 220.00, 261.63, 349.23] },
    { bass:  65.41, notes: [261.63, 329.63, 392.00, 523.25] },
    { bass:  98.00, notes: [196.00, 246.94, 293.66, 392.00] }
  ];
  const PIANO_PATTERN = [0, 1, 2, 3, 2, 1, 2, 3];
  const GUITAR = [
    [[0.0, 523.25, 0.9], [1.0, 659.25, 0.9], [2.0, 783.99, 0.9], [3.0, 880.00, 0.45], [3.5, 783.99, 0.45]],
    [[0.0, 698.46, 0.9], [1.0, 523.25, 0.9], [2.0, 440.00, 0.9], [3.0, 466.16, 0.45], [3.5, 440.00, 0.45]],
    [[0.0, 523.25, 0.9], [1.0, 659.25, 0.9], [2.0, 783.99, 0.9], [3.0, 987.77, 0.45], [3.5, 880.00, 0.45]],
    [[0.0, 493.88, 0.9], [1.0, 587.33, 0.9], [2.0, 783.99, 0.9], [3.0, 739.99, 0.45], [3.5, 587.33, 0.45]]
  ];

  function scheduleBar(barIndex, startTime) {
    const chord = CHORDS[barIndex];

    kick(startTime + 0 * BEAT, 0.34);
    kick(startTime + 2 * BEAT, 0.34);
    snare(startTime + 1 * BEAT, 0.13);
    snare(startTime + 3 * BEAT, 0.13);
    for (let b = 0; b < 4; b += 0.5) {
      hat(startTime + b * BEAT, b % 1 === 0 ? 0.05 : 0.028);
    }

    bassNote(startTime + 0 * BEAT, chord.bass,       BEAT * 0.9, 0.14);
    bassNote(startTime + 2 * BEAT, chord.bass,       BEAT * 0.9, 0.14);
    bassNote(startTime + 1 * BEAT, chord.bass * 1.5, BEAT * 0.8, 0.10);
    bassNote(startTime + 3 * BEAT, chord.bass * 1.5, BEAT * 0.8, 0.10);

    for (let i = 0; i < 8; i++) {
      const beatPos = i * 0.5;
      const noteIdx = PIANO_PATTERN[i];
      const freq = chord.notes[noteIdx];
      const vol = (i === 0 || i === 4) ? 0.048 : 0.032;
      pianoNote(startTime + beatPos * BEAT, freq, BEAT * 0.62, vol);
    }

    const guitarNotes = GUITAR[barIndex];
    for (let i = 0; i < guitarNotes.length; i++) {
      const g = guitarNotes[i];
      guitarNote(startTime + g[0] * BEAT, g[1], g[2] * BEAT, 0.065);
    }

    const nextBar = (barIndex + 1) % 4;
    musicTimer = setTimeout(() => {
      if (!musicStarted) return;
      scheduleBar(nextBar, startTime + BAR);
    }, Math.max(0, (BAR - LOOKAHEAD) * 1000));
  }

  scheduleBar(0, actx.currentTime + 0.15);
}

window.addEventListener("pointerdown", initAudio, { once:true });
window.addEventListener("keydown", initAudio, { once:true });
window.addEventListener("touchstart", initAudio, { once:true });

/* ============================================================
   6. EFFECTS
   ============================================================ */
function burst(gx, gy, color, count) {
  const c = cellCenterF(gx, gy);
  const n = count || 12;
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = 40 + Math.random()*140;
    particles.push({
      x:c.x, y:c.y,
      vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:1, max:0.5+Math.random()*0.5,
      size: view.cell*(0.10+Math.random()*0.18),
      color: color
    });
  }
}
function floatText(gx, gy, text, color) {
  const c = cellCenterF(gx, gy);
  floats.push({ x:c.x, y:c.y - view.cell*0.3, text, color, life:1 });
}
function shakeScreen(mag, dur) {
  shake.mag = Math.max(shake.mag, mag);
  shake.dur = dur; shake.t = dur;
}

/* ============================================================
   7. GRID HELPERS
   ============================================================ */
function makeBlocked(cells, obstacles, ignoreHead, ignoreTail) {
  const b = new Uint8Array(TOTAL);
  const n = cells.length;
  for (let i=0;i<n;i++){
    if (ignoreHead && i===0) continue;
    if (ignoreTail && i===n-1) continue;
    const c = cells[i];
    if (c.x>=0 && c.x<COLS && c.y>=0 && c.y<ROWS) b[idx(c.x,c.y)] = 1;
  }
  obstacles.forEach(k => {
    const p = k.split(",");
    const x=+p[0], y=+p[1];
    if (x>=0 && x<COLS && y>=0 && y<ROWS) b[idx(x,y)] = 1;
  });
  return b;
}
function bfsFrom(sx, sy, blocked, wrap) {
  const dist = new Int16Array(TOTAL).fill(-1);
  if (sx<0||sx>=COLS||sy<0||sy>=ROWS) return dist;
  if (blocked[idx(sx,sy)]) return dist;
  const qx = new Int16Array(TOTAL), qy = new Int16Array(TOTAL);
  let head=0, tail=0;
  qx[tail]=sx; qy[tail]=sy; tail++;
  dist[idx(sx,sy)] = 0;
  while (head<tail) {
    const x=qx[head], y=qy[head]; head++;
    const d = dist[idx(x,y)];
    for (let i=0;i<4;i++){
      const k = DIR_KEYS[i];
      let nx = x + DIRS[k].x;
      let ny = y + DIRS[k].y;
      if (wrap) { nx=(nx+COLS)%COLS; ny=(ny+ROWS)%ROWS; }
      else if (nx<0||nx>=COLS||ny<0||ny>=ROWS) continue;
      const ii = idx(nx,ny);
      if (blocked[ii]||dist[ii]!==-1) continue;
      dist[ii] = d+1;
      qx[tail]=nx; qy[tail]=ny; tail++;
    }
  }
  return dist;
}
function simulateSnake(snake, nx, ny, grow) {
  const ns = [{x:nx,y:ny}];
  for (let i=0;i<snake.length;i++) ns.push({x:snake[i].x,y:snake[i].y});
  let net;
  if (grow>0) net=1; else if (grow<0) net=-1; else net=0;
  let popCount = 1 - net;
  while (popCount-- > 0 && ns.length > 1) ns.pop();
  return ns;
}

/* ============================================================
   8. AI
   ============================================================ */
function chooseDirection() {
  if (!game.snake.length) return null;
  const head = game.snake[0];
  const wrap = game.ghostTime > 0;
  const food = game.food;
  const blocked = makeBlocked(game.snake, game.obstacles, true, game.pendingGrow <= 0);
  const options = [];
  for (const key of DIR_KEYS) {
    if (key === OPPOSITE[game.dir]) continue;
    let nx = head.x + DIRS[key].x, ny = head.y + DIRS[key].y;
    if (wrap) { nx=(nx+COLS)%COLS; ny=(ny+ROWS)%ROWS; }
    else if (nx<0 || nx>=COLS || ny<0 || ny>=ROWS) continue;
    if (game.obstacles.has(nx+","+ny)) continue;
    const eats = food && nx===food.x && ny===food.y;
    const tail = game.snake[game.snake.length-1];
    const tailVacates = game.pendingGrow + (eats ? food.grow : 0) <= 0;
    const onTail = nx===tail.x && ny===tail.y;
    if (blocked[idx(nx,ny)] && !(onTail && tailVacates)) continue;
    const sim = simulateSnake(game.snake,nx,ny,game.pendingGrow+(eats?food.grow:0));
    const simBlocked = makeBlocked(sim,game.obstacles,true,true);
    const reachDist = bfsFrom(nx,ny,simBlocked,wrap);
    let reach=0;
    for(let i=0;i<TOTAL;i++) if(reachDist[i]>=0) reach++;
    const simTail=sim[sim.length-1];
    const tailReach=reachDist[idx(simTail.x,simTail.y)]>=0;
    const safe = reach>=sim.length || tailReach;
    let foodDistance=9999;
    if(food) {
      const foodBlocked=makeBlocked(sim,game.obstacles,true,true);
      foodBlocked[idx(food.x,food.y)]=0;
      const path=bfsFrom(nx,ny,foodBlocked,wrap);
      foodDistance=path[idx(food.x,food.y)];
      if(foodDistance<0) foodDistance=9999;
    }
    const visits=game.recentHeads.reduce((n,v)=>n+(v===idx(nx,ny)?1:0),0);
    options.push({dir:key,safe,reach,foodDistance,visits,eats});
  }
  if(!options.length) return null;
  options.sort((a,b)=> {
    if(a.safe!==b.safe) return Number(b.safe)-Number(a.safe);
    if(a.eats!==b.eats) return Number(b.eats)-Number(a.eats);
    if(a.foodDistance!==b.foodDistance) return a.foodDistance-b.foodDistance;
    if(a.visits!==b.visits) return a.visits-b.visits;
    return b.reach-a.reach;
  });
  return options[0].dir;
}
function pickFoodType() {
  let r = Math.random()*FOOD_TOTAL_WEIGHT;
  for (let i=0;i<FOOD_TYPES.length;i++){
    r -= FOOD_TYPES[i].weight;
    if (r <= 0) return FOOD_TYPES[i];
  }
  return FOOD_TYPES[0];
}
function randomFreeCell() {
  const occ = new Uint8Array(TOTAL);
  for (let i=0;i<game.snake.length;i++) occ[idx(game.snake[i].x, game.snake[i].y)] = 1;
  game.obstacles.forEach(k=>{ const p=k.split(","); occ[idx(+p[0],+p[1])] = 1; });
  if (game.food) occ[idx(game.food.x, game.food.y)] = 1;
  const free = [];
  for (let i=0;i<TOTAL;i++) if (!occ[i]) free.push(i);
  if (!free.length) return null;
  const p = free[(Math.random()*free.length)|0];
  return { x: p % COLS, y: (p / COLS)|0 };
}
function spawnFood() {
  const type = pickFoodType();
  const cell = randomFreeCell();
  if (!cell) { game.food = null; return; }
  game.food = {
    x: cell.x, y: cell.y,
    id: type.id, emoji: type.emoji,
    points: type.points, grow: type.grow, color: type.color,
    pulse: Math.random()*Math.PI*2
  };
}

/* ============================================================
   10. LEVELS
   ============================================================ */
function addObstaclesForLevel(level) {
  const target = Math.min(3 + level*2, 34);
  let tries = 0;
  while (game.obstacles.size < target && tries < 900) {
    tries++;
    const cx = 1 + ((Math.random()*(COLS-2))|0);
    const cy = 1 + ((Math.random()*(ROWS-2))|0);
    const size = 1 + ((Math.random()*3)|0);
    const cells = [{x:cx,y:cy}];
    let px=cx, py=cy;
    for (let i=1;i<size;i++){
      const d = DIRS[DIR_KEYS[(Math.random()*4)|0]];
      px += d.x; py += d.y;
      if (px<1||px>=COLS-1||py<1||py>=ROWS-1) break;
      cells.push({x:px,y:py});
    }
    let ok = true;
    const head = game.snake[0];
    for (let i=0;i<cells.length && ok;i++){
      const c = cells[i];
      const k = c.x+","+c.y;
      if (game.obstacles.has(k)) { ok=false; break; }
      if (game.food && game.food.x===c.x && game.food.y===c.y) { ok=false; break; }
      for (let j=0;j<game.snake.length;j++){
        if (game.snake[j].x===c.x && game.snake[j].y===c.y) { ok=false; break; }
      }
      if (!ok) break;
      if (Math.abs(head.x-c.x)+Math.abs(head.y-c.y) < 5) { ok=false; break; }
      if (c.x===head.x && Math.abs(c.y-head.y) < 6) { ok=false; break; }
    }
    if (!ok) continue;
    for (let i=0;i<cells.length;i++) game.obstacles.add(cells[i].x+","+cells[i].y);
  }
}
function nextLevel(reason) {
  const previous = game.level;
  game.level = previous % MAX_LEVEL + 1;
  game.levelTransitions++;
  game.levelScore = 0;
  game.stepsWithoutFood = 0;
  game.recentHeads = [];
  game.snake = [];
  const sx=Math.floor(COLS/2),sy=Math.floor(ROWS/2);
  for(let i=0;i<START_LEN;i++) game.snake.push({x:sx-i,y:sy});
  game.prevSnake=game.snake.map(p=>({...p}));
  game.dir="right";
  game.pendingGrow=0;
  game.prog=0;
  game.ghostTime=0;
  game.boostTime=0;
  game.dead=false;
  game.dying=0;
  game.obstacles=new Set();
  game.food=null;
  game.stepMs=Math.max(MIN_STEP_MS,BASE_STEP_MS-(game.level-1)*7);
  // Keep a navigable arena: random obstacles can isolate food and trap the AI.
  // Each level varies by speed and colour without blocking its path.
  spawnFood();
  overlayEl.classList.remove("show");
  particles=[]; floats=[];
  floatText(sx,sy-2,"LEVEL "+game.level,"#caff32");
  sfx("level");
  updateHUD();
}
function checkLevelUp() {
  if(game.levelScore>=LEVEL_SCORE) { nextLevel("score"); return true; }
  return false;
}
function updateHUD() {
  scoreEl.textContent = game.score;
  levelEl.textContent = game.level;
  bestEl.textContent = game.best;
}
function loadBest() {
  try {
    const v = parseInt(localStorage.getItem("snake_shorts_best") || "0", 10);
    game.best = isNaN(v) ? 0 : v;
  } catch(e){ game.best = 0; }
}
function saveBest() {
  try { localStorage.setItem("snake_shorts_best", String(game.best)); } catch(e){}
}

/* ============================================================
   12. FLOW
   ============================================================ */
function resetGame() {
  clearTimeout(game.autoRestartTimer);
  game.autoRestartTimer = null;

  game.snake = [];
  const sx = Math.floor(COLS/2), sy = Math.floor(ROWS/2);
  for (let i=0;i<START_LEN;i++) game.snake.push({x:sx-i, y:sy});
  game.prevSnake = game.snake.map(s=>({x:s.x, y:s.y}));

  game.dir = "right";
  game.obstacles = new Set();
  game.pendingGrow = 0;
  game.score = 0;
  game.level = 1;
  game.levelScore = 0;
  game.stepsWithoutFood = 0;
  game.recentHeads = [];
  game.stepMs = BASE_STEP_MS;
  game.prog = 0;
  game.dead = false;
  game.dying = 0;
  game.ghostTime = 0;
  game.boostTime = 0;
  game.food = null;

  particles = [];
  floats = [];
  shake.t = 0;
  deathFlash = 0;

  overlayEl.classList.remove("show");

  spawnFood();
  updateHUD();
}

function die() {
  if (game.dead) return;
  game.dead = true;
  game.dying = 620;
  deathFlash = 1;
  shakeScreen(9, 380);
  sfx("die");

  game.prevSnake = game.snake.map(s=>({x:s.x, y:s.y}));
  game.prog = 0;

  for (let i=0;i<game.snake.length;i++){
    const s = game.snake[i];
    const c = cellCenterF(s.x, s.y);
    for (let k=0;k<3;k++){
      const a = Math.random()*Math.PI*2;
      const sp = 40 + Math.random()*160;
      particles.push({
        x:c.x, y:c.y,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:1, max:0.7+Math.random()*0.6,
        size: view.cell*(0.12+Math.random()*0.2),
        color: i===0 ? "#caff32" : "#5ce65c"
      });
    }
  }

  if (game.score > game.best) {
    game.best = game.score;
    saveBest();
    updateHUD();
  }
  setTimeout(showGameOver, 620);
}

function showGameOver() {
  ovScore.textContent = game.score;
  ovLevel.textContent = game.level;
  ovBest.textContent = game.best;
  overlayEl.classList.add("show");
  game.autoRestartTimer = setTimeout(() => nextLevel("collision"), 1400);
}

/* ============================================================
   13. STEP
   ============================================================ */
function stepGame() {
  if (game.dead) return;

  game.prevSnake = game.snake.map(s=>({x:s.x, y:s.y}));

  const dir = chooseDirection();
  if (!dir) { die(); return; }
  game.dir = dir;

  const head = game.snake[0];
  let nx = head.x + DIRS[dir].x;
  let ny = head.y + DIRS[dir].y;
  const wrap = game.ghostTime > 0;

  if (wrap) { nx=(nx+COLS)%COLS; ny=(ny+ROWS)%ROWS; }
  else if (nx<0||nx>=COLS||ny<0||ny>=ROWS) { die(); return; }

  if (game.obstacles.has(nx+","+ny)) { die(); return; }

  {
    const eatingNext = game.food && game.food.x===nx && game.food.y===ny;
    const tailMoves = game.pendingGrow + (eatingNext ? game.food.grow : 0) <= 0;
    const limit = game.snake.length - (tailMoves ? 1 : 0);
    for (let i=0;i<limit;i++){
      if (game.snake[i].x===nx && game.snake[i].y===ny) { die(); return; }
    }
  }

  game.snake.unshift({x:nx, y:ny});

  if (game.food && game.food.x===nx && game.food.y===ny) {
    const f = game.food;
    game.score += f.points;
    game.levelScore += f.points;
    game.stepsWithoutFood = 0;
    game.recentHeads = [];
    game.pendingGrow += f.grow;

    burst(f.x, f.y, f.color, 16);
    floatText(f.x, f.y, "+"+f.points, f.color);
    shakeScreen(3, 130);

    if (f.id === "ghost")  game.ghostTime = GHOST_MS;
    if (f.id === "golden") game.boostTime = BOOST_MS;

    sfx(f.id === "golden" ? "golden" : "eat");

    if (game.score > game.best) { game.best = game.score; saveBest(); }
    updateHUD();
    if (checkLevelUp()) return;
    spawnFood();
  }

  let net;
  if (game.pendingGrow > 0) { net=1; game.pendingGrow--; }
  else if (game.pendingGrow < 0) { net=-1; game.pendingGrow++; }
  else net=0;
  let pop = 1 - net;
  while (pop-- > 0 && game.snake.length > 3) game.snake.pop();
  game.stepsWithoutFood++;
  game.recentHeads.push(idx(nx,ny));
  if(game.recentHeads.length>65) game.recentHeads.shift();
  // A watchdog prevents an endless repeating path even if the food is unreachable.
  if(game.stepsWithoutFood >= STUCK_STEPS) nextLevel("stuck");
}

/* ============================================================
   14. EFFECTS UPDATE
   ============================================================ */
function updateEffects(dt) {
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt / p.max;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 340*dt; p.vx *= 0.985;
  }
  for (let i=floats.length-1;i>=0;i--){
    const f = floats[i];
    f.life -= dt / 0.9;
    f.y -= 42*dt;
    if (f.life <= 0) floats.splice(i,1);
  }
  if (shake.t > 0) { shake.t -= dt*1000; if (shake.t <= 0) { shake.t=0; shake.mag=0; } }
  if (deathFlash > 0) { deathFlash -= dt*2.2; if (deathFlash < 0) deathFlash = 0; }
  if (game.ghostTime > 0) { game.ghostTime -= dt*1000; if (game.ghostTime < 0) game.ghostTime = 0; }
  if (game.boostTime > 0) { game.boostTime -= dt*1000; if (game.boostTime < 0) game.boostTime = 0; }
}

/* ============================================================
   15. RENDER
   ============================================================ */
function roundRect(x,y,w,h,r) {
  if (r > w/2) r = w/2;
  if (r > h/2) r = h/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

/* Smooth polyline: quadratic curves through the mid-points.
   Removes the tiny corner "pop" that straight segments produce. */
function tracePath(list) {
  ctx.beginPath();
  if (list.length === 1) {
    ctx.moveTo(list[0].x, list[0].y);
    ctx.lineTo(list[0].x + 0.01, list[0].y + 0.01);
    return;
  }
  ctx.moveTo(list[0].x, list[0].y);
  for (let i = 1; i < list.length - 1; i++) {
    const mx = (list[i].x + list[i+1].x) * 0.5;
    const my = (list[i].y + list[i+1].y) * 0.5;
    ctx.quadraticCurveTo(list[i].x, list[i].y, mx, my);
  }
  ctx.lineTo(list[list.length-1].x, list[list.length-1].y);
}

function drawGrid() {
  const {ox,oy,cell,gw,gh} = view;
  ctx.fillStyle = rgbCss(curTheme.gridBg);
  ctx.fillRect(ox,oy,gw,gh);
  ctx.globalAlpha = 0.055;
  ctx.fillStyle = rgbCss(curTheme.gridAlt);
  for (let y=0;y<ROWS;y++){
    for (let x=0;x<COLS;x++){
      if ((x+y)%2===0) ctx.fillRect(ox+x*cell, oy+y*cell, cell, cell);
    }
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "#ffffff1a";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(ox+0.75, oy+0.75, gw-1.5, gh-1.5);
}

function drawObstacles() {
  const {ox,oy,cell} = view;
  ctx.fillStyle = "#07331a";
  ctx.strokeStyle = "#3fbf4a";
  ctx.lineWidth = Math.max(1, cell*0.06);
  game.obstacles.forEach(k=>{
    const p = k.split(",");
    const x=+p[0], y=+p[1];
    const px = ox + x*cell + cell*0.08;
    const py = oy + y*cell + cell*0.08;
    const s = cell*0.84;
    roundRect(px, py, s, s, cell*0.22);
    ctx.fill(); ctx.stroke();
  });
}

function drawFood() {
  if (!game.food) return;
  const f = game.food;
  const c = cellCenterF(f.x, f.y);
  const t = performance.now() / 1000;
  const pulse = 1 + Math.sin(t*4 + f.pulse) * 0.08;

  const grad = ctx.createRadialGradient(c.x,c.y,0, c.x,c.y, view.cell*1.5);
  grad.addColorStop(0, f.color + "88");
  grad.addColorStop(1, f.color + "00");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(c.x, c.y, view.cell*1.5, 0, Math.PI*2);
  ctx.fill();

  const size = view.cell*0.76*pulse;
  ctx.font = size + "px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(f.emoji, c.x, c.y + size*0.04);
}

function drawSnake() {
  const n = game.snake.length;
  if (!n) return;

  const ghost = game.ghostTime > 0;
  const { cell } = view;

  /* stable progress — no jumps when the speed changes */
  let t = game.dead ? 0 : game.prog;
  if (t < 0) t = 0;
  if (t > 1) t = 1;

  const prev = game.prevSnake;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const c = game.snake[i];
    const p = prev[i] || prev[prev.length - 1] || c;
    const dx = c.x - p.x, dy = c.y - p.y;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) pts.push({ x: c.x, y: c.y });
    else pts.push({ x: p.x + dx * t, y: p.y + dy * t });
  }

  /* colours follow the live theme */
  const headColor = rgbCss(curTheme.snHead);
  const midColor  = rgbCss(curTheme.snMid);
  const tailColor = rgbCss(curTheme.snTail);
  const glowColor = rgbCss(curTheme.snGlow);

  /* grid coords -> screen coords */
  const sp = new Array(pts.length);
  for (let i = 0; i < pts.length; i++) sp[i] = cellCenterF(pts[i].x, pts[i].y);

  /* split the path only where it really jumps (wrap / ghost mode) */
  const segments = [];
  let seg = [sp[0]];
  for (let i = 1; i < sp.length; i++) {
    const a = sp[i-1], b = sp[i];
    if (Math.abs(a.x - b.x) > cell*1.6 || Math.abs(a.y - b.y) > cell*1.6) {
      segments.push(seg); seg = [b];
    } else seg.push(b);
  }
  segments.push(seg);

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = cell * 0.80;
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = cell * 0.55;

  for (let s = 0; s < segments.length; s++) {
    const list = segments[s];
    if (!list.length) continue;

    if (list.length === 1) {
      ctx.fillStyle = headColor;
      ctx.beginPath();
      ctx.arc(list[0].x, list[0].y, cell*0.40, 0, Math.PI*2);
      ctx.fill();
      continue;
    }

    const first = list[0], last = list[list.length-1];
    let grad;
    if (first.x === last.x && first.y === last.y) {
      grad = headColor;
    } else {
      grad = ctx.createLinearGradient(first.x, first.y, last.x, last.y);
      grad.addColorStop(0, headColor);
      grad.addColorStop(0.5, midColor);
      grad.addColorStop(1, tailColor);
    }
    ctx.strokeStyle = grad;
    tracePath(list);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  /* ---- head ---- */
  const hc = sp[0];
  const d = DIRS[game.dir];

  ctx.fillStyle = headColor;
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = cell * 0.75;
  ctx.beginPath();
  ctx.arc(hc.x, hc.y, cell*0.45, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  const eyeOff = cell*0.19;
  const eyeR = Math.max(1.4, cell*0.11);
  const pupilR = Math.max(0.9, cell*0.055);
  const px = d.x * cell * 0.15;
  const py = d.y * cell * 0.15;
  const perpX = -d.y, perpY = d.x;

  for (let k=-1;k<=1;k+=2){
    const ex = hc.x + px + perpX*eyeOff*k;
    const ey = hc.y + py + perpY*eyeOff*k;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#0b2a10";
    ctx.beginPath();
    ctx.arc(ex + d.x*eyeR*0.35, ey + d.y*eyeR*0.35, pupilR, 0, Math.PI*2);
    ctx.fill();
  }

  if (ghost) {
    const tt = performance.now()/1000;
    ctx.globalAlpha = 0.14 + Math.sin(tt*8)*0.05;
    ctx.fillStyle = rgbCss(curTheme.snMid);
    ctx.fillRect(view.ox, view.oy, view.gw, view.gh);
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  for (let i=0;i<particles.length;i++){
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFloats() {
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (let i=0;i<floats.length;i++){
    const f = floats[i];
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = "900 " + (view.cell*0.62) + "px Arial, sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  const dpr = view.dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,view.W,view.H);

  if (shake.t > 0) {
    const m = shake.mag * (shake.t/shake.dur);
    ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m);
  }

  drawGrid();
  drawObstacles();
  drawFood();
  if (!game.dead || game.dying > 0) drawSnake();
  drawParticles();
  drawFloats();

  if (deathFlash > 0) {
    ctx.fillStyle = "rgba(255,40,40," + (deathFlash*0.32) + ")";
    ctx.fillRect(0,0,view.W,view.H);
  }
}

/* ============================================================
   16. LOOP
   ============================================================ */
let lastTime = 0;
function loop(now) {
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  updateEffects(dt);
  updateTheme(dt);

  if (!game.dead) {
    /* normalised progress: completely smooth even when the
       step duration changes (level-up / golden boost) */
    game.prog += (dt * 1000) / effectiveStepMs();

    let guard = 0;
    while (game.prog >= 1 && guard < 4) {
      game.prog -= 1;
      const oldLevel=game.level;
      stepGame();
      if(game.level!==oldLevel) { game.prog=0; break; }
      guard++;
      if (game.dead) break;
    }
    if (game.dead) game.prog = 0;
    else if (game.prog > 1) game.prog = 1;
  } else if (game.dying > 0) {
    game.dying -= dt * 1000;
  }

  draw();
  requestAnimationFrame(loop);
}

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeCanvas, 90);
});

/* ============================================================
   17. BOOT
   ============================================================ */
loadBest();
resizeCanvas();
resetGame();
updateHUD();
applyThemeCSS();
requestAnimationFrame(loop);

})();
</script>
